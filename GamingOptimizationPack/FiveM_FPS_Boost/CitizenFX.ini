[Game]
; FiveM FPS Optimization Settings
; Maximum Performance Configuration

; Disable unnecessary features
DisablePsoCompilation=1
DisableDelay=0
DisableAvatar=1
DisableMinimapOnFoot=0
DisableDeathScreenBlur=1

; Graphics optimizations
DisableShadows=1
DisableReflections=1
DisableWaterReflections=1
DisableGrass=1
DisablePostFx=1
DisableMotionBlur=1
DisableDepthOfField=1
DisableAmbientOcclusion=1
DisableTessellation=1
DisableAntiAliasing=1

; Performance settings
MaximumStreamingMemory=1024
MaximumStreamingCPU=0
MinimumStreamingCPU=0
MaximumFakeStream=0
MaximumExtraServers=0

; Network optimizations
NetworkOptimization=1
NetworkHighEnabled=0
NetworkLowEnabled=0
NetworkPacketRate=30
NetworkMinimumRate=15
NetworkMaximumRate=30

; Memory settings
MemoryAllocation=2048
MemoryBudget=4096
StreamingMemoryBudget=2048
TextureBudget=1024

; CPU optimization
CPUCores=0
CPUThreadCount=0
CPUAffinity=0

; Disable不必要的 effects
DisableScreenBlur=1
DisableScreenBlood=1
DisableScreenShake=1
DisableScreenFlash=1
DisableScreenWobble=1
DisableScreenTint=1

; Streaming settings
EnableStreaming=1
StreamingMode=0
StreamingBudget=2048
StreamingMemoryLimit=4096

[GameSound]
; Disable unnecessary sounds for FPS
DisableAmbientSounds=1
DisableMusic=0
DisableSoundEffects=0
DisableVoiceChat=0

[GameInput]
; Input optimization
RawInput=1
MouseSensitivity=1.0
InvertMouse=0
GamepadDeadzone=0.1

[Network]
; Network optimization for FiveM
MaxPlayers=64
EnableVoiceChat=0
VoiceChatQuality=0
EnableTextChat=1
TextChatFilter=0

[Debug]
; Debug settings (disable for production)
EnableDebug=0
DebugLevel=0
LogPerformance=0
