[DISPLAY]
; Display Settings - Maximum FPS
WindowMode=2
; 0=Fullscreen, 1=Windowed, 2=Borderless
AdapterOutputIndex=0
AspectRatio=Auto
ResolutionType=Native
ResolutionWidth=1920
ResolutionHeight=1080
RefreshRate=144
VSync=0
; 0=Off, 1=On
FullScreenMode=0
; 0=Exclusive, 1=Borderless

[GRAPHICS_QUALITY]
; Graphics Quality - LOW for Maximum FPS
OverallQualityLevel=1
; 0=Low, 1=Medium, 2=High, 3=Ultra
TextureQuality=1
; 0=Low, 1=Medium, 2=High
TextureFiltering=1
; 0=Low, 1=Medium, 2=High
LOD=1
; 0=Low, 1=Medium, 2=High
ShadingQuality=1
; 0=Low, 1=Medium, 2=High
ShadowQuality=1
; 0=Low, 1=Medium, 2=High
ReflectionQuality=1
; 0=Low, 1=Medium, 2=High
AmbientOcclusion=1
; 0=Off, 1=Low, 2=High
LensEffects=0
; 0=Off, 1=On
Bloom=0
; 0=Off, 1=On
DepthOfField=0
; 0=Off, 1=On
MotionBlur=0
; 0=Off, 1=On
AntiAliasingMethod=0
; 0=None, 1=MSAA, 2=TAA, 3=FXAA
MSAASamples=0
; 0=Off, 1=2x, 2=4x
RenderScaling=100
; 50-200%

[ADVANCED_GRAPHICS]
; Advanced Graphics - LOW for Maximum FPS
EnableRayTracing=0
; 0=Off, 1=On
RayTracingShadows=0
; 0=Off, 1=On
RayTracingReflections=0
; 0=Off, 1=On
RayTracingAmbientOcclusion=0
; 0=Off, 1=On
DLSS=0
; 0=Off, 1=On
FSR=0
; 0=Off, 1=On
RenderAPI=2
; 0=DX11, 1=DX12, 2=Vulkan

[DISPLAY_SETTINGS]
; Display Settings
HUDSize=100
FOV=90
; 60-90
Brightnes=50
Contrast=50
ColorblindType=0
; 0=Off, 1=Deuteranopia, 2=Protanopia, 3=Tritanopia
ColorblindStrength=10

[GAMEPLAY]
; Gameplay Settings
MouseSensitivity=10
; 1-100
MouseSensitivityMultiplier=1.0
AimDownSightsSensitivity=50
; 1-100
ControllerVibration=0
; 0=Off, 1=On
VSync=0
; 0=Off, 1=On

[NETWORK]
; Network Settings
NetworkSmoothing=0
; 0=Off, 1=On
BandwidthSaving=0
; 0=Off, 1=On
DataCenter=auto
; auto or specific region

[UBISOFT_CONNECT]
; Ubisoft Connect Settings
EnableOverlay=0
; 0=Off, 1=On
EnableScreenshots=0
; 0=Off, 1=On
EnableNotifications=0
; 0=Off, 1=On
