<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account | Ocean Anti-Cheat</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#0a0e12;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:400px;background:#11161d;border:1px solid #1e2733;border-radius:14px;padding:36px 32px}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .logo svg{width:32px;height:32px;border-radius:7px}
  .logo span{font-weight:700;font-size:18px;letter-spacing:.3px}
  h1{font-size:22px;margin:18px 0 6px}
  p.sub{color:#8a94a6;font-size:13px;margin-bottom:24px}
  label{display:block;font-size:12px;color:#9aa5b6;margin:14px 0 6px}
  input{width:100%;padding:11px 13px;background:#0c1117;border:1px solid #243042;border-radius:9px;color:#e2e8f0;font-size:14px;outline:none}
  input:focus{border-color:#3b82f6}
  button{width:100%;margin-top:22px;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:#1d4ed8}
  .err{color:#f87171;font-size:13px;margin-top:12px;min-height:16px}
  .alt{text-align:center;font-size:13px;color:#8a94a6;margin-top:16px}
  .alt a{color:#93c5fd;text-decoration:none;font-weight:600}
  .hint{margin-top:10px;font-size:12px;color:#64748b;line-height:1.5}
</style>
</head>
<body>
<form class="card" id="f">
  <div class="logo"><svg width="32" height="32" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#2563eb"/><path d="M18 16 L32 12 L46 16 L50 30 L44 46 L32 52 L20 46 L14 30 Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><circle cx="32" cy="30" r="7" fill="#fff"/></svg><span>Ocean Anti-Cheat</span></div>
  <p class="sub">Everything you do is saved to this account.</p>
  <h1>Create account</h1>
  <label for="u">Username</label>
  <input id="u" autocomplete="username" placeholder="3-32 letters, numbers, dots or dashes" required>
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="new-password" placeholder="at least 6 characters" required>
  <label for="c">Confirm password</label>
  <input id="c" type="password" autocomplete="new-password" placeholder="repeat it" required>
  <div class="err" id="e"></div>
  <button type="submit">Create account</button>
  <div class="hint">Pins, scans and stats are tied to this account. Afterwards you can only sign in to an existing account.</div>
  <div class="alt">Already have an account? <a href="/auth/login">Sign in</a></div>
</form>
<script>
  document.getElementById('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var u=document.getElementById('u').value.trim();
    var p=document.getElementById('p').value;
    var c=document.getElementById('c').value;
    if(!u || !p){document.getElementById('e').textContent='Please fill in every field.';return;}
    if(p!==c){document.getElementById('e').textContent='Passwords do not match.';return;}
    var btn=document.querySelector('button'); btn.disabled=true; btn.textContent='Creating...';
    fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:u,password:p,confirm:c})})
      .then(function(r){return r.json().catch(function(){return {};});})
      .then(function(d){
        if(d && d.ok){
          try{localStorage.setItem('__OC_REAL_USER__',JSON.stringify(d.user));}catch(e){}
          location.href='/dashboard';
        }else{
          btn.disabled=false; btn.textContent='Create account';
          var m={username_exists:'That username is already taken.',invalid_username:'Use 3-32 letters, numbers, dots or dashes.',weak_password:'Password must be at least 6 characters.',password_mismatch:'Passwords do not match.'};
          document.getElementById('e').textContent=m[d.error]||(d.error||'Sign up failed.');
        }
      })
      .catch(function(){ btn.disabled=false; btn.textContent='Create account'; document.getElementById('e').textContent='Cannot reach the server.'; });
  });
</script>
</body>
</html>
