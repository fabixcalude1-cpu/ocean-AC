<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean Anti-Cheat — Sign in</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  html{font-optical-sizing:auto;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
  html body{background:#000 !important}
  body{
    font-family:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:#000;
    color:#f5f3ff;
    font-size:17px;
    line-height:1.47;
    letter-spacing:-0.011em;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    padding-left:max(20px, env(safe-area-inset-left));
    padding-right:max(20px, env(safe-area-inset-right));
    overflow:hidden;
    position:relative;
  }
  /* háttér — halk lila bloom + a kurzort követő fény egyetlen, a kártya
     MÖGÖTTI rétegben (a .stage z-index:1), így a kártya materialje
     átszűri a fényt. Szándékosan sima elem, nem body::before/::after:
     a backdrop-filter + negatív/blend rétegek kombinációja egyes
     (szoftveres) compositorokon fekete képkockát okoz. */
  .oc-glow{
    position:fixed;inset:0;
    z-index:0;
    pointer-events:none;      background:
      radial-gradient(520px circle at var(--mx,50%) var(--my,45%),
        rgba(130,70,220,0.22), rgba(140,80,225,0.10) 32%, transparent 68%),
      radial-gradient(60vw 40vh at 14% -6%, rgba(130,70,220,0.18), transparent 60%),
      radial-gradient(46vw 38vh at 96% 106%, rgba(110,50,200,0.14), transparent 62%);
  }
  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:430px;
  }
  .card{
    /* material-regular over 30px blur — no hard border, no drop shadow */
    background:rgba(12,8,24,0.78);
    backdrop-filter:blur(32px) saturate(180%);
    -webkit-backdrop-filter:blur(32px) saturate(180%);
    border:none;
    border-radius:16px;
    padding:32px 30px 26px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .card::before{
    content:"";
    position:absolute;inset:-1px;
    border-radius:16px;
    background:transparent;
    z-index:-1;
    display:none;
  }
  /* hover-light-up: card glows when mouse enters */
  .card:hover{
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 0 40px rgba(130,70,220,0.15);
    transition:box-shadow 0.3s ease;
  }
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo svg{width:40px;height:40px;border-radius:10px;box-shadow:0 0 22px rgba(168,85,247,0.45)}
  .logo-name{font-weight:800;font-size:20px;letter-spacing:.4px;background:linear-gradient(90deg,#9d62e0,#8a4fd0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo-sub{font-size:12px;color:rgba(245,243,255,0.45);margin-top:1px}
  h1{font-size:28px;font-weight:600;margin:20px 0 6px;letter-spacing:-.022em;text-shadow:0 0 24px rgba(130,70,220,0.2)}
  p.sub{color:rgba(245,243,255,0.72);font-size:15px;margin-bottom:20px;line-height:1.47}
  /* segmented control: surface-grouped track, soft tint on the active segment */
  .tabs{display:flex;background:rgba(255,255,255,0.045);border:none;border-radius:12px;padding:3px;margin-bottom:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05)}
  .tab{flex:1;min-height:36px;padding:10px;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit;color:rgba(245,243,255,0.72);background:transparent;transition:background-color .25s ease,color .25s ease}
  .tab.on{background:rgba(130,70,220,0.16);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,0.08)}
  .tab:hover{background:rgba(130,70,220,0.08)}
  label{display:block;font-size:13px;font-weight:500;color:rgba(245,243,255,0.7);margin:14px 0 6px}
  /* inputs: surface-grouped fill, no border, radius 10, 4px tinted focus halo */
  input{
    width:100%;padding:11px 14px;min-height:40px;background:rgba(255,255,255,0.04);border:1px solid transparent;border-radius:10px;
    color:#f5f3ff;font-family:inherit;font-size:15px;outline:none;
    transition:background-color .2s ease, box-shadow .2s ease;
  }
  input:hover{background:rgba(255,255,255,0.06)}
  input:focus{background:rgba(255,255,255,0.065);box-shadow:0 0 0 4px rgba(130,70,220,0.16)}
  input::placeholder{color:rgba(245,243,255,0.42)}
  .err{color:#ff453a;font-size:13px;margin-top:12px;min-height:16px;text-align:center}
  /* primary action: ONE solid system tint, radius 12, weight 600, no shadow */
  button[type=submit]{
    width:100%;margin-top:18px;padding:12px 20px;min-height:44px;background:linear-gradient(135deg,#6a35b0,#8a4fd0);
    color:#fff;
    border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.15), 0 4px 20px rgba(110,50,200,0.35);
    transition:background .22s ease, transform .18s cubic-bezier(0.34,1.56,0.64,1), box-shadow .22s ease;
    animation:btnBreath 4s ease-in-out infinite;
  }
  button[type=submit]:hover{background:linear-gradient(135deg,#7a44c0,#9d62e0);transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.18), 0 6px 28px rgba(130,70,220,0.45)}
  button[type=submit]:active{transform:translateY(0) scale(.99)}
  button[type=submit]:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(130,70,220,0.15)}
  button[type=submit]:disabled{opacity:.45;cursor:default;transform:none;animation:none;box-shadow:inset 0 1px 0 rgba(255,255,255,0.1)}
  @keyframes btnBreath{
    0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,0.15), 0 0 0 rgba(130,70,220,0)}
    50%{box-shadow:inset 0 1px 0 rgba(255,255,255,0.15), 0 0 20px rgba(130,70,220,0.3)}
  }
  .hint{margin-top:16px;font-size:12px;color:rgba(245,243,255,0.45);line-height:1.6;text-align:center}
  .foot{margin-top:22px;text-align:center}
  .foot a{color:#9d62e0;text-decoration:none;font-weight:600;font-size:13px;transition:color .2s}
  .foot a:hover{color:#b48ae8; text-shadow:0 0 12px rgba(140,80,225,0.3)}
  .loading{
    margin-top:18px;height:4px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,0.06);display:none;
  }
  .loading.on{display:block}
  .loading i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#9333ea,#c084fc);animation:load 1s ease-in-out infinite}
  @keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
  @media (max-width:480px){
    .card{padding:26px 20px 22px}
    h1{font-size:24px}
  }
  @media (pointer:coarse){
    .tab{min-height:44px}
    input{min-height:44px;font-size:17px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
    body::after{display:none}
  }
</style>
</head>
<body>
<div class="oc-glow" aria-hidden="true"></div>
<div class="stage">
  <form class="card oc-sheet" id="f" novalidate>
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#0a0a0d"/><path d="M18 16 L32 12 L46 16 L50 30 L44 46 L32 52 L20 46 L14 30 Z" fill="none" stroke="#a855f7" stroke-width="4" stroke-linejoin="round"/><circle cx="32" cy="30" r="7" fill="#c084fc"/></svg>
      <div>
        <div class="logo-name">OCEAN AC</div>
        <div class="logo-sub">anticheat console</div>
      </div>
    </div>
    <div class="tabs">
      <button type="button" class="tab on" data-mode="login">Sign in</button>
      <button type="button" class="tab" data-mode="register">Create account</button>
    </div>
    <h1 data-title>Welcome back</h1>
    <p class="sub">Sign in to your account — pins, scans and stats are all stored here.</p>
    <label for="u">Username</label>
    <input id="u" autocomplete="username" placeholder="your username" required>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" placeholder="••••••••" required>
    <div data-conf-wrap style="display:none">
      <label for="c">Confirm password</label>
      <input id="c" type="password" autocomplete="new-password" placeholder="repeat it" required>
    </div>
    <div class="err" id="e"></div>
    <div class="loading" id="l"><i></i></div>
    <button type="submit" class="btn-brand" data-submit>Sign in</button>
    <div class="hint" data-hint>Create your account once — afterwards you can only sign in to an existing account.</div>
    <div class="foot"><a href="/dashboard" class="note">Back to dashboard</a></div>
  </form>
</div>
<script>
  var app = (function(){
    var mode = 'login';
    var errMsg = {
      username_exists:'That username is already taken.',
      invalid_username:'Use 3-32 letters, numbers, dots or dashes.',
      weak_password:'Password must be at least 6 characters.',
      password_mismatch:'Passwords do not match.',
      bad_credentials:'Wrong username or password.'
    };

    function $(s, r){ return (r||document).querySelector(s); }
    var u=$('#u'), p=$('#p'), c=$('#c'), e=$('#e'), l=$('#l'), submit=$('[data-submit]');
    var confWrap=$('[data-conf-wrap]'), title=$('[data-title]'), hint=$('[data-hint]');

    function setMode(m){
      mode = m;
      var isReg = m==='register';
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
        var on = t.getAttribute('data-mode')===m;
        t.className = 'tab' + (on?' on':'');
      });
      confWrap.style.display = isReg ? 'block':'none';
      submit.textContent = isReg ? 'Create account':'Sign in';
      title.textContent = isReg ? 'Create your account':'Welcome back';
      hint.textContent = isReg
        ? 'Pins, scans and stats are tied to this account. Afterwards you can only sign in to an existing account.'
        : 'Create your account once — afterwards you can only sign in to an existing account.';
      c.required = isReg;
      e.textContent = '';
    }
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
      t.addEventListener('click', function(){ setMode(t.getAttribute('data-mode')); });
    });

    function showErr(t){ e.textContent=t; }
    function submit2(){
      var un=u.value.trim(), pw=p.value;
      e.textContent='';
      if(!un){ showErr('Enter your username.'); return; }
      if(!pw){ showErr('Enter your password.'); return; }
      var body = mode==='register' ? {username:un,password:pw,confirm:c.value} : {username:un,password:pw};
      submit.disabled=true; submit.textContent='Working...'; l.className='loading on';
      fetch('/api/auth/'+(mode==='register'?'register':'login'), {method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)})
        .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }).catch(function(){ return {ok:false,d:{}}; }); })
        .then(function(x){
          if(x.ok && x.d && x.d.ok){
            try{ localStorage.setItem('__OC_REAL_USER__', JSON.stringify(x.d.user)); }catch(_){}
            location.href='/dashboard';
          } else {
            submit.disabled=false; submit.textContent=mode==='register'?'Create account':'Sign in'; l.className='loading';
            showErr(errMsg[x.d&&x.d.error] || x.d.error || 'Something went wrong.');
          }
        })
        .catch(function(){ submit.disabled=false; submit.textContent=mode==='register'?'Create account':'Sign in'; l.className='loading'; showErr('Cannot reach the server.'); });
    }

    submit.addEventListener('click', function(ev){ ev.preventDefault(); ev.stopPropagation(); submit2(); });
    function onKey(ev){ if(ev.key==='Enter'){ ev.preventDefault(); submit2(); } }
    u.addEventListener('keydown',onKey); p.addEventListener('keydown',onKey); c.addEventListener('keydown',onKey);

    /* cursor-követő glow */
    function track(){
      var r=document.documentElement;
      function mv(ev){ r.style.setProperty('--mx', ev.clientX+'px'); r.style.setProperty('--my', ev.clientY+'px'); }
      window.addEventListener('mousemove', mv, {passive:true});
      r.style.setProperty('--mx','50%'); r.style.setProperty('--my','45%');
    }
    track();
    
    /* smooth cursor light-up: when mouse enters the card, it glows */
    var card = document.querySelector('.card');
    if(card){
      card.addEventListener('mouseenter', function(){ card.style.transition = 'box-shadow 0.3s ease'; card.style.boxShadow = 'inset 0 1px 0 rgba(255,255,255,0.08), 0 0 40px rgba(130,70,220,0.15)'; });
      card.addEventListener('mouseleave', function(){ card.style.boxShadow = 'inset 0 1px 0 rgba(255,255,255,0.06)'; });
    }
    setTimeout(function(){ u.focus(); }, 60);
  })();
</script>
</body>
</html>
