<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean Anti-Cheat — Sign in</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  html body{background:#000 !important}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:#000;
    color:#e2e8f0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow:hidden;
    position:relative;
  }
  /* háttér glow foltok + finom grid */
  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(700px 450px at 15% -10%, rgba(168,85,247,0.22), transparent 65%),
      radial-gradient(600px 420px at 110% 115%, rgba(147,51,234,0.18), transparent 60%),
      radial-gradient(400px 300px at 50% 50%, rgba(59,130,246,0.08), transparent 70%),
      #000;
    z-index:-2;
    pointer-events:none;
  }
  /* cursor-követő fény — az egér alatt felvilágosít */
  body::after{
    content:"";
    position:fixed;inset:0;
    background:radial-gradient(520px circle at var(--mx,50%) var(--my,45%),
      rgba(168,85,247,0.16), rgba(232,121,249,0.08) 32%, transparent 68%);
    z-index:0;
    pointer-events:none;
    mix-blend-mode:screen;
  }
  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:430px;
  }
  .card{
    background:rgba(7,7,10,0.88);
    border:1px solid rgba(168,85,247,0.28);
    border-radius:18px;
    padding:34px 32px 26px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.03), 0 30px 80px rgba(0,0,0,0.85), 0 0 60px rgba(168,85,247,0.08);
    backdrop-filter:blur(12px);
  }
  .card::before{
    content:"";
    position:absolute;inset:-1px;
    border-radius:18px;
    background:linear-gradient(120deg, rgba(168,85,247,0.5), rgba(168,85,247,0.08) 38%, rgba(232,121,249,0.4) 68%, rgba(168,85,247,0.5));
    z-index:-1;
    filter:blur(1px);
    opacity:0.55;
  }
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo svg{width:40px;height:40px;border-radius:10px;box-shadow:0 0 22px rgba(168,85,247,0.45)}
  .logo-name{font-weight:800;font-size:20px;letter-spacing:.4px;background:linear-gradient(90deg,#e879f9,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo-sub{font-size:12px;color:#8a94a6;margin-top:1px}
  h1{font-size:24px;margin:20px 0 6px;letter-spacing:-.01em}
  p.sub{color:#8a94a6;font-size:13px;margin-bottom:20px;line-height:1.5}
  .tabs{display:flex;background:rgba(255,255,255,0.04);border:1px solid rgba(168,85,247,0.2);border-radius:12px;padding:4px;margin-bottom:20px}
  .tab{flex:1;padding:10px;border:none;border-radius:9px;cursor:pointer;font:600 13.5px inherit;color:#8a94a6;background:transparent;transition:all .25s}
  .tab.on{background:linear-gradient(90deg,#9333ea,#a855f7);color:#fff;box-shadow:0 6px 20px rgba(147,51,234,0.45)}
  label{display:block;font-size:12px;color:#9aa5b6;margin:14px 0 6px;letter-spacing:.02em}
  input{
    width:100%;padding:12px 13px;background:#0a0a0d;border:1px solid rgba(168,85,247,0.22);border-radius:10px;
    color:#e2e8f0;font-size:14px;outline:none;transition:border-color .2s, box-shadow .2s;
  }
  input:focus{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,0.16)}
  input::placeholder{color:#3d4450}
  .err{color:#f87171;font-size:13px;margin-top:12px;min-height:16px;text-align:center}
  button[type=submit]{
    width:100%;margin-top:18px;padding:13px;background:linear-gradient(90deg,#9333ea,#a855f7);color:#fff;
    border:none;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;transition:all .25s;
    box-shadow:0 10px 30px rgba(147,51,234,0.35);
  }
  button[type=submit]:hover{box-shadow:0 14px 40px rgba(168,85,247,0.55);transform:translateY(-1px)}
  button[type=submit]:disabled{opacity:.55;cursor:default;transform:none}
  .hint{margin-top:16px;font-size:11.5px;color:#5b6472;line-height:1.6;text-align:center}
  .foot{margin-top:22px;text-align:center}
  .foot a{color:#c084fc;text-decoration:none;font-weight:600;font-size:13px}
  .foot a:hover{text-decoration:underline;color:#e879f9}
  .loading{
    margin-top:18px;height:4px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,0.06);display:none;
  }
  .loading.on{display:block}
  .loading i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#9333ea,#e879f9);animation:load 1s ease-in-out infinite}
  @keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
</style>
</head>
<body>
<div class="stage">
  <form class="card" id="f" novalidate>
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#0a0a0d"/><path d="M18 16 L32 12 L46 16 L50 30 L44 46 L32 52 L20 46 L14 30 Z" fill="none" stroke="#a855f7" stroke-width="4" stroke-linejoin="round"/><circle cx="32" cy="30" r="7" fill="#e879f9"/></svg>
      <div>
        <div class="logo-name">OCEAN AC</div>
        <div class="logo-sub">anticheat console</div>
      </div>
    </div>
    <div class="tabs">
      <button type="button" class="tab on" data-mode="login">Sign in</button>
      <button type="button" class="tab" data-mode="register">Create account</button>
    </div>
    <h1 data-title>Welcome back</h1>
    <p class="sub">Sign in to your account — pins, scans and stats are all stored here.</p>
    <label for="u">Username</label>
    <input id="u" autocomplete="username" placeholder="your username" required>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" placeholder="••••••••" required>
    <div data-conf-wrap style="display:none">
      <label for="c">Confirm password</label>
      <input id="c" type="password" autocomplete="new-password" placeholder="repeat it" required>
    </div>
    <div class="err" id="e"></div>
    <div class="loading" id="l"><i></i></div>
    <button type="submit" data-submit>Sign in</button>
    <div class="hint" data-hint>Create your account once — afterwards you can only sign in to an existing account.</div>
    <div class="foot"><a href="/dashboard" class="note">Back to dashboard</a></div>
  </form>
</div>
<script>
  var app = (function(){
    var mode = 'login';
    var errMsg = {
      username_exists:'That username is already taken.',
      invalid_username:'Use 3-32 letters, numbers, dots or dashes.',
      weak_password:'Password must be at least 6 characters.',
      password_mismatch:'Passwords do not match.',
      bad_credentials:'Wrong username or password.'
    };

    function $(s, r){ return (r||document).querySelector(s); }
    var u=$('#u'), p=$('#p'), c=$('#c'), e=$('#e'), l=$('#l'), submit=$('[data-submit]');
    var confWrap=$('[data-conf-wrap]'), title=$('[data-title]'), hint=$('[data-hint]');

    function setMode(m){
      mode = m;
      var isReg = m==='register';
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
        var on = t.getAttribute('data-mode')===m;
        t.className = 'tab' + (on?' on':'');
      });
      confWrap.style.display = isReg ? 'block':'none';
      submit.textContent = isReg ? 'Create account':'Sign in';
      title.textContent = isReg ? 'Create your account':'Welcome back';
      hint.textContent = isReg
        ? 'Pins, scans and stats are tied to this account. Afterwards you can only sign in to an existing account.'
        : 'Create your account once — afterwards you can only sign in to an existing account.';
      c.required = isReg;
      e.textContent = '';
    }
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
      t.addEventListener('click', function(){ setMode(t.getAttribute('data-mode')); });
    });

    function showErr(t){ e.textContent=t; }
    function submit2(){
      var un=u.value.trim(), pw=p.value;
      e.textContent='';
      if(!un){ showErr('Enter your username.'); return; }
      if(!pw){ showErr('Enter your password.'); return; }
      var body = mode==='register' ? {username:un,password:pw,confirm:c.value} : {username:un,password:pw};
      submit.disabled=true; submit.textContent='Working...'; l.className='loading on';
      fetch('/api/auth/'+(mode==='register'?'register':'login'), {method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)})
        .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }).catch(function(){ return {ok:false,d:{}}; }); })
        .then(function(x){
          if(x.ok && x.d && x.d.ok){
            try{ localStorage.setItem('__OC_REAL_USER__', JSON.stringify(x.d.user)); }catch(_){}
            location.href='/dashboard';
          } else {
            submit.disabled=false; submit.textContent=mode==='register'?'Create account':'Sign in'; l.className='loading';
            showErr(errMsg[x.d&&x.d.error] || x.d.error || 'Something went wrong.');
          }
        })
        .catch(function(){ submit.disabled=false; submit.textContent=mode==='register'?'Create account':'Sign in'; l.className='loading'; showErr('Cannot reach the server.'); });
    }

    submit.addEventListener('click', function(ev){ ev.preventDefault(); ev.stopPropagation(); submit2(); });
    function onKey(ev){ if(ev.key==='Enter'){ ev.preventDefault(); submit2(); } }
    u.addEventListener('keydown',onKey); p.addEventListener('keydown',onKey); c.addEventListener('keydown',onKey);

    /* cursor-követő glow */
    function track(){
      var r=document.documentElement;
      function mv(ev){ r.style.setProperty('--mx', ev.clientX+'px'); r.style.setProperty('--my', ev.clientY+'px'); }
      window.addEventListener('mousemove', mv, {passive:true});
      r.style.setProperty('--mx','50%'); r.style.setProperty('--my','45%');
    }
    track();
    setTimeout(function(){ u.focus(); }, 60);
  })();
</script>
</body>
</html>
