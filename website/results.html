<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Results</title>
    <style>
        :root { --bg: #09090b; --card-bg: #18181b; --border: #27272a; --text: #fafafa; --muted: #a1a1aa; --accent: #3b82f6; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 24px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        h2 { font-size: 16px; margin: 0 0 16px; color: var(--muted); }
        .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .log-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
        .log-item { background: #000; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <div id="app" style="max-width: 1100px; margin: 0 auto;">
        <h1 style="margin-bottom: 24px;">Activity Report</h1>
        <div class="card" id="logs"><h2>Actions</h2></div>
    </div>
    <script>
        function loadScan(scanId) {
            fetch('/api/scans').then(r => r.json()).then(scans => {
                const scan = Array.isArray(scans) ? scans.find(item => item.id === scanId) : null;
                const logsDiv = document.getElementById('logs');
                if (!scan) {
                    logsDiv.insertAdjacentHTML('beforeend', '<p>No scan was found.</p>');
                    return;
                }
                (scan.activityLog || []).forEach(log => {
                    const item = document.createElement('div');
                    item.className = 'log-item';
                    item.textContent = `${log.filename || 'Unknown file'} - ${log.action || 'Unknown action'}`;
                    logsDiv.appendChild(item);
                });
            }).catch(() => {
                document.getElementById('logs').insertAdjacentHTML('beforeend', '<p>Unable to load scan results.</p>');
            });
        }

        const scanId = new URLSearchParams(window.location.search).get('scan');
        if (scanId) loadScan(scanId);
    </script>
</body>
</html>
