<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Interface - Puter.js Bridge</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background-color: #1a1a1a; color: #e5e5e5; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background-color: #262626; border-right: 1px solid #404040; display: flex; flex-direction: column; padding: 16px; }
        .logo { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 16px; }
        .main-content { flex: 1; display: flex; flex-direction: column; background-color: #1a1a1a; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; position: relative; }
        .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
        .chat-container { display: none; flex-direction: column; height: 100vh; overflow: hidden; }
        .chat-container.active { display: flex; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; margin-bottom: 20px; }
        .message { margin-bottom: 24px; display: flex; gap: 12px; }
        .message.user { flex-direction: row-reverse; }
        .message-content { max-width: 70%; background-color: #262626; border-radius: 12px; padding: 16px; color: #e5e5e5; white-space: pre-wrap; }
        .message.user .message-content { background-color: #ff6b35; color: white; }
        .search-container { width: 100%; max-width: 600px; position: relative; margin-bottom: 20px; }
        .search-input { width: 100%; padding: 16px; background-color: #262626; border: 1px solid #404040; border-radius: 12px; color: #fff; font-size: 16px; outline: none; resize: none; min-height: 50px; }
        .send-btn { background-color: #ff6b35; border: none; color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .model-btn { background: #262626; border: 1px solid #404040; color: #b3b3b3; padding: 8px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; }
        .bridge-status { padding: 10px; background: #2a2a2a; border-radius: 8px; border: 1px solid #404040; margin-bottom: 15px; text-align: center; font-size: 13px; color: #22c55e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">Claude (Puter.js Bridge)</div>
            <div class="bridge-status" id="bridgeStatus">🟢 Opencode Bridge Active</div>
            <div style="font-size: 13px; color: #808080; margin-top: 20px;">
                Models:<br>
                • Claude Sonnet 4<br>
                • Claude Opus 4<br>
                • Claude 3.7 Sonnet
            </div>
        </div>
        <div class="main-content">
            <div class="welcome-screen" id="welcomeScreen">
                <h1 style="margin-bottom: 20px; font-weight: 400;">Good morning</h1>
                <button class="model-btn" id="modelSelector">Model: Claude Sonnet 4</button>
                <div class="search-container">
                    <textarea class="search-input" id="welcomeInput" placeholder="How can I help you today?"></textarea>
                    <button class="send-btn" id="sendBtn">Send Message</button>
                </div>
                <button id="authButton" style="background: #4a90e2; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-top: 10px;">
                    🔐 Authenticate with Puter
                </button>
            </div>
            <div class="chat-container" id="chatContainer">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="search-container">
                    <textarea class="search-input" id="chatInput" placeholder="Message Claude..."></textarea>
                    <button class="send-btn" id="chatSendBtn">Send</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const models = ['claude-sonnet-4', 'claude-opus-4', 'claude-3-7-sonnet'];
        let currentModelIdx = 0;
        let chatHistory = [];

        document.getElementById('modelSelector').onclick = () => {
            currentModelIdx = (currentModelIdx + 1) % models.length;
            document.getElementById('modelSelector').textContent = 'Model: ' + models[currentModelIdx];
        };

        document.getElementById('authButton').onclick = async () => {
            try {
                await puter.ai.chat("test", {model: models[currentModelIdx]});
                alert('Authenticated successfully with Puter!');
            } catch(e) {
                alert('Auth error: ' + e.message);
            }
        };

        async function handleSend(text) {
            if (!text.trim()) return;
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('chatContainer').classList.add('active');
            
            appendMsg(text, 'user');
            chatHistory.push({ role: 'user', content: text });

            try {
                const resp = await puter.ai.chat(chatHistory, { model: models[currentModelIdx], stream: true });
                const { contentDiv } = appendMsg('', 'assistant');
                let full = '';
                for await (const part of resp) {
                    if (part?.text) {
                        full += part.text;
                        contentDiv.textContent = full;
                    }
                }
                chatHistory.push({ role: 'assistant', content: full });
            } catch(e) {
                appendMsg('Error: ' + e.message, 'assistant');
                chatHistory.pop();
            }
        }

        async function pollOpencodeRequests() {
            while (true) {
                try {
                    const res = await fetch('/api/poll');
                    const data = await res.json();
                    if (data && data.id) {
                        console.log('📥 Received Opencode request:', data);
                        const messages = data.messages || [];
                        const model = data.model || models[currentModelIdx];
                        
                        try {
                            const aiResp = await puter.ai.chat(messages, { model: model });
                            let replyText = "";
                            if (typeof aiResp === 'string') {
                                replyText = aiResp;
                            } else if (aiResp?.message?.content) {
                                replyText = aiResp.message.content;
                            } else if (aiResp?.text) {
                                replyText = aiResp.text;
                            } else {
                                replyText = JSON.stringify(aiResp);
                            }
                            
                            await fetch('/api/response', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ id: data.id, result: replyText })
                            });
                        } catch (err) {
                            console.error('❌ Puter AI error for Opencode request:', err);
                            await fetch('/api/response', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ id: data.id, result: 'Error from Puter AI: ' + err.message })
                            });
                        }
                    }
                } catch (err) {
                }
                await new Promise(r => setTimeout(r, 1000));
            }
        }

        window.addEventListener('load', () => {
            pollOpencodeRequests();
        });

        document.getElementById('sendBtn').onclick = () => {
            const val = document.getElementById('welcomeInput').value;
            document.getElementById('welcomeInput').value = '';
            handleSend(val);
        };
        document.getElementById('chatSendBtn').onclick = () => {
            const val = document.getElementById('chatInput').value;
            document.getElementById('chatInput').value = '';
            handleSend(val);
        };
    </script>
</body>
</html>
